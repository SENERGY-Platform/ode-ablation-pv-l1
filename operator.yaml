# The operator as the analytics stack registers it (§5.14).
#
# ODE offers registration as an explicit action and never performs it on its own,
# so this file is the payload that action sends. Edit it here; it is the source of
# truth for what the pipeline editor will show.
name: ode-ablation-pv-l1
description: 24 h-ahead forecast of hourly mean PV power (W) from archived weather forecasts
image: ghcr.io/senergy-platform/ode-ablation-pv-l1:latest

# Public makes the operator visible to other users of the platform. Registration
# is a developer decision and so is this.
pub: false
deploymentType: local

# What the pipeline editor offers as inputs. Each "name" matches a selector arg in
# op.py: "power" alone is the PV input, the rest together are the weather input
# (the Open-Meteo previous-runs forecast import).
inputs:
  - name: power
    type: float
  - name: forecasted_for
    type: string
  - name: issued_at
    type: string
  - name: lead_days
    type: int
  - name: shortwave_radiation
    type: float
  - name: direct_radiation
    type: float
  - name: diffuse_radiation
    type: float
  - name: cloud_cover
    type: float
  - name: temperature_2m
    type: float

# What the operator emits. These are the keys of the dictionary infer() returns.
outputs:
  - name: prediction
    type: float
  - name: forecast_hour
    type: string
  - name: horizon_h
    type: float

# Deployment configuration, matching CustomConfig in op.py.
config_values:
  - name: retrain_after_s
    type: int
